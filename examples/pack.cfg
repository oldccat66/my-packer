# A readable packing profile. Every protection switch is explicit.
version = 2

[project]
input = 'input.exe'
output = 'protected.exe'

[protection]
pack = true
anti_debug = false
anti_vm = false
import_protection = false
memory_protection = false
resource_protection = false
strip_fixups = false
strip_debug_info = false
virtualization = false
mutation = false
compression = 'lzma'                # Managed inputs currently require LZMA.
use_xor = 'fast'                    # none, fast, balance, secure
use_xor_layer2 = false              # Optional second encryption pass.
cpu_hash_slots = 32
vm_entry_compatibility_buffer = 0    # Native VM-entry padding is disabled.

[files]
enable = false
