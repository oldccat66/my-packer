# Packing only: this profile does not select functions for virtualization.
version = 2

[protection]
options = 0x100
compression = 'lzma'                # Managed inputs currently require LZMA.
packer_cipher = 'fast'              # none, fast, balance, secure
packer_cipher_layer2 = false        # Optional second encryption pass.
cpu_hash_slots = 32
vm_entry_compatibility_buffer = 0    # Native VM-entry padding is disabled.

[files]
enable = false
