name: Build and publish my-vmp Windows CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (for example v1.0.0); blank uses the run number
        required: false
        default: ''
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-2022

    steps:
      - name: Checkout publishing repository
        uses: actions/checkout@v4

      - name: Validate private source settings
        id: source
        shell: pwsh
        env:
          SOURCE_REPOSITORY_URL: ${{ secrets.SOURCE_REPOSITORY_URL }}
          SOURCE_REPOSITORY_TOKEN: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REPOSITORY_URL)) {
            throw 'SOURCE_REPOSITORY_URL secret is missing.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REPOSITORY_TOKEN)) {
            throw 'SOURCE_REPOSITORY_TOKEN secret is missing.'
          }

          $repositoryUri = [Uri]$env:SOURCE_REPOSITORY_URL.Trim()
          if ($repositoryUri.Scheme -ne 'https' -or $repositoryUri.Host -ne 'github.com') {
            throw 'SOURCE_REPOSITORY_URL must be an https://github.com/owner/repository URL.'
          }
          $repository = $repositoryUri.AbsolutePath.Trim('/') -replace '\.git$', ''
          if ($repository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'SOURCE_REPOSITORY_URL must identify exactly one GitHub repository.'
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "repository=$repository`n", [Text.UTF8Encoding]::new($false))

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: main
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Read source build profile
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $profilePath = Join-Path $source 'CI_BUILDTYPE'
          if (-not (Test-Path -LiteralPath $profilePath -PathType Leaf)) {
            throw "CI_BUILDTYPE was not found: $profilePath"
          }

          $buildType = (Get-Content -LiteralPath $profilePath -Raw).Trim().ToLowerInvariant()
          if ($buildType -notin @('beta', 'dev', 'release')) {
            throw "CI_BUILDTYPE must be beta, dev, or release; got '$buildType'."
          }

          $configuration = switch ($buildType) {
            'beta' { 'Beta' }
            'dev' { 'Dev' }
            'release' { 'Release' }
          }
          $utf8 = [Text.UTF8Encoding]::new($false)
          $environment = "BUILD_TYPE=$buildType`nBUILD_CONFIGURATION=$configuration`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $environment, $utf8)
          Write-Host "BUILD_TYPE=$buildType"

      - name: Build x64 CLI
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $solution = Join-Path $source 'my-vmp.sln'
          $configuration = $env:BUILD_CONFIGURATION
          $oldCl = $env:CL
          try {
            $env:CL = '/wd4819'
            & msbuild $solution /t:my-vmp "/p:Configuration=$configuration" /p:Platform=x64 /p:WholeProgramOptimization=false /p:LinkTimeCodeGeneration=Default /m /nr:false /v:minimal
            if ($LASTEXITCODE -ne 0) {
              throw "CLI build failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            $env:CL = $oldCl
          }

      - name: Build and run x64 unit tests
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          & msbuild (Join-Path $source 'vcproj\unit-tests.vcxproj') /p:Configuration=Dev /p:Platform=x64 /p:SolutionDir="$source\" /m /nr:false /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "Unit-test build failed with exit code $LASTEXITCODE."
          }

          $test = Join-Path $source 'bin\64\Dev\unit-tests.exe'
          if (-not (Test-Path -LiteralPath $test)) {
            throw "Unit-test binary was not found: $test"
          }
          $results = Join-Path $env:GITHUB_WORKSPACE 'unit-test-results.xml'
          Push-Location $source
          try {
            & $test "--gtest_output=xml:$results"
            if ($LASTEXITCODE -ne 0) {
              throw "Unit tests failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

      - name: Package CLI and checksum
        id: package
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          SOURCE_REF: main
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $configuration = $env:BUILD_CONFIGURATION
          $cli = Join-Path $source "bin\64\$configuration\my-vmp.exe"
          if (-not (Test-Path -LiteralPath $cli)) {
            throw "CLI for the $configuration profile was not produced: $cli"
          }

          $tag = $env:RELEASE_TAG_INPUT.Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v0.0.$env:GITHUB_RUN_NUMBER"
          }
          if ($tag -notmatch '^v?[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Invalid release tag: $tag"
          }
          if (-not $tag.StartsWith('v')) {
            $tag = "v$tag"
          }

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $packageDir = Join-Path $releaseDir 'package'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $zipName = "my-vmp-windows-x64-$tag.zip"
          $zipPath = Join-Path $releaseDir $zipName
          Copy-Item -LiteralPath $cli -Destination (Join-Path $packageDir 'my-vmp.exe')
          [IO.File]::WriteAllText((Join-Path $packageDir 'CI_BUILDTYPE'), $env:BUILD_TYPE, [Text.Encoding]::ASCII)
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $marker = $archive.GetEntry('CI_BUILDTYPE')
            if (-not $marker) {
              throw 'The release ZIP does not contain CI_BUILDTYPE.'
            }
            $reader = [IO.StreamReader]::new($marker.Open(), [Text.Encoding]::ASCII)
            try {
              if ($reader.ReadToEnd() -cne $env:BUILD_TYPE) {
                throw 'The release ZIP CI_BUILDTYPE does not match the source profile.'
              }
            }
            finally {
              $reader.Dispose()
            }
          }
          finally {
            $archive.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $releaseDir 'SHA256SUMS.txt'
          "$hash  $zipName" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          $sourceCommit = (git -C $source rev-parse HEAD).Trim()
          @"
          ## Build

          - Source ref: $env:SOURCE_REF
          - Source commit: $sourceCommit
          - Build profile: $configuration|x64
          - Unit tests: passed in the workflow

          The ZIP contains the CLI executable and `CI_BUILDTYPE`, which records the selected build profile. Verify it with `SHA256SUMS.txt`.
          "@ | Set-Content -LiteralPath (Join-Path $releaseDir 'RELEASE-NOTES.md') -Encoding utf8

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "zip=$zipPath" >> $env:GITHUB_OUTPUT
          "checksums=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksums }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, $env:ZIP_PATH, $env:CHECKSUM_PATH, '--title', "my-vmp $env:RELEASE_TAG", '--notes-file', (Join-Path $env:GITHUB_WORKSPACE 'release\RELEASE-NOTES.md'))
          if ($env:PRERELEASE_INPUT -eq 'true') {
            $releaseArgs += '--prerelease'
          }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
